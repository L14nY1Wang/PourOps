{{define "screen"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>酒单 - {{if .Brand}}{{.Brand}}{{else}}PourOps{{end}}</title>
<link rel="icon" href="{{asset "/static/brand/pourops.svg"}}" type="image/svg+xml">
<!--
  数字酒单板 · PourOps（电视全屏，无滚动）
  信息层级：出酒编号 → 供应状态 → 厂牌 → 酒款 → 风格 → ABV/IBU/杯型 → 价格
  数据源（按顺序取第一个能用的）: ?src=xxx → /api/screen/playlist → playlist.json
  协议:
    { "brand": "PourOps", "show_clock": true,
      "items": [ {
        "no": "07",                        // 可选，缺省按顺序 01..N
        "brewery": "酿酒狗", "brewery_en": "BREWDOG",
        "name": "朋克 IPA", "name_en": "PUNK IPA",
        "style": "IPA - American",         // 决定默认分类与色条颜色（可被 category 覆盖）
        "tags": ["美式IPA", "热带水果"],    // 风格描述，取前 3 个
        "sales_tags": ["新品"],            // 可选，最多展示 2 个
        "abv": 5.2, "ibu": 35, "size": "330ml",
        "sold": true,                      // false = 售罄（仍保留全部信息）
        "price": "¥ 45 / 杯",
        "cups": [ { "ml": 150, "size": "150ml", "price": "¥ 28" } ], // 可选，多杯型分档价
        "poster": "https://..."            // 可选，作低调水印，无图不影响排版
      } ] }
  实时更新: 默认监听 /api/screen/events 的 SSE（任意 message 即重拉），断则退回 60s 轮询
  快捷键: Esc 退出全屏，双击切换全屏
-->
<style>
  :root{
    --bg:#ece6db; --bg-top:#f5f1e8; --bg-deep:#e4dccd;
    --card:#faf7f1; --card-hi:#fffdf9; --card-low:#f3ede2;
    --ink:#1f1c18; --ink-2:#544d43; --ink-3:#867d70;
    --amber:#b86b18; --amber-ink:#8c4d0b; --amber-bg:rgba(184,107,24,.11); --amber-line:rgba(184,107,24,.28);
    --foam:#138a63; --foam-bg:rgba(244,251,248,.90); --foam-line:rgba(19,138,99,.30);
    --alert:#c8432b; --alert-bg:rgba(253,245,243,.92); --alert-line:rgba(200,67,43,.30);
    --line:rgba(46,38,26,.11); --line-soft:rgba(46,38,26,.075);
    --head:clamp(64px,8.4vh,98px);
    --pad-x:clamp(14px,1.6vw,36px);
    --pad-y:clamp(10px,1.4vh,26px);
    --gx:clamp(10px,1vw,20px);
    --gy:clamp(8px,.9vh,16px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden; color:var(--ink);}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
    background:
      radial-gradient(88vw 58vh at 6% -12%, rgba(217,154,68,.13), transparent 62%),
      radial-gradient(72vw 52vh at 102% 108%, rgba(82,196,154,.09), transparent 60%),
      radial-gradient(54vw 42vh at 52% 48%, rgba(255,253,248,.62), transparent 72%),
      linear-gradient(180deg,var(--bg-top),var(--bg) 64%,var(--bg-deep));
  }

  /* ---------- 顶栏：品牌标识 + PourOps + 今日供应 + 时间 ---------- */
  body > .top{
    position:fixed; z-index:3; top:0; left:0; right:0; height:var(--head);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 var(--pad-x);
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(248,244,236,.95),rgba(243,238,229,.84));
    backdrop-filter:blur(12px);
  }
  .brand{display:flex; align-items:center; gap:clamp(10px,1vw,18px); min-width:0;}
  .whale{height:clamp(32px,5.2vh,58px); width:auto; flex:none; filter:drop-shadow(0 2px 8px rgba(31,28,24,.10));}
  .brand-txt{min-width:0;}
  .mark{
    font-size:clamp(15px,1.15vw,26px); font-weight:800; line-height:1.05;
    letter-spacing:.26em; text-transform:uppercase; white-space:nowrap;
  }
  .kicker{
    display:inline-flex; align-items:center; gap:.55em;
    margin-top:.48em; font-size:clamp(9px,.62vw,12px); font-weight:600;
    letter-spacing:.32em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap;
  }
  .kicker::before{
    content:""; width:6px; height:6px; border-radius:50%; background:var(--foam);
    box-shadow:0 0 0 3px rgba(19,138,99,.16);
  }
  .head-r{display:flex; align-items:center; gap:clamp(14px,1.6vw,30px); min-width:0;}
  .summary{
    padding:.32em .8em; border-radius:999px; border:1px solid var(--line);
    background:rgba(255,253,249,.78);
    font-size:clamp(10px,.72vw,14px); letter-spacing:.12em; color:var(--ink-2); white-space:nowrap;
  }
  .summary b{font-size:1.12em; color:var(--ink); letter-spacing:.04em; font-variant-numeric:tabular-nums;}
  .clock{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(18px,1.52vw,32px); font-weight:650; letter-spacing:.06em;
    font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap;
    padding-left:clamp(10px,1vw,20px); border-left:1px solid var(--line);
  }

  /* ---------- 酒单网格：4×3（12 酒头），窄屏由 JS 收列 ---------- */
  .board{
    --cols:4; --rows:3; --fit:1;
    --cw:calc((100vw - 2 * var(--pad-x) - (var(--cols) - 1) * var(--gx)) / var(--cols));
    --ch:calc((100vh - var(--head) - 2 * var(--pad-y) - (var(--rows) - 1) * var(--gy)) / var(--rows));
    --u:min(calc(var(--cw) * .62), calc(var(--ch) * .82));
    position:fixed; inset:0;
    padding:calc(var(--head) + var(--pad-y)) var(--pad-x) var(--pad-y);
    display:grid; gap:var(--gy) var(--gx);
    grid-template-columns:repeat(var(--cols),minmax(0,1fr));
    grid-template-rows:repeat(var(--rows),minmax(0,1fr));
  }

  .card{
    position:relative; display:flex; flex-direction:column;
    min-width:0; min-height:0; overflow:hidden;
    padding:calc(var(--u) * .085) calc(var(--u) * .102);
    border-radius:clamp(11px,.78vw,16px);
    background:
      radial-gradient(110% 68% at 0% 0%, color-mix(in srgb,var(--tone) 11%,transparent), transparent 58%),
      linear-gradient(160deg,var(--card-hi),var(--card) 58%,var(--card-low));
    border:1px solid var(--line);
    box-shadow:0 10px 26px rgba(44,34,20,.07), 0 2px 6px rgba(44,34,20,.04), inset 0 1px 0 rgba(255,255,255,.88);
    animation:rise .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:calc(var(--i,0) * 42ms);
  }
  .card::before{
    content:""; position:absolute; left:0; right:0; top:0; height:4px; opacity:.95;
    background:linear-gradient(90deg,var(--tone),color-mix(in srgb,var(--tone) 42%,transparent) 66%,transparent 92%);
  }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion:reduce){ .card{animation:none;} }

  .card-top{position:relative; z-index:2; display:flex; align-items:center; gap:calc(var(--u) * .058); min-width:0; flex:none;}
  .tap{display:inline-flex; align-items:baseline; gap:.32em; flex:none;}
  .tap b{
    display:inline-grid; place-items:center; min-width:1.58em; padding:.18em .32em;
    border-radius:calc(var(--u) * .055);
    background:linear-gradient(160deg,#322c26,#1d1915); color:#fffdf8;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:calc(var(--u) * .185 * var(--fit)); font-weight:800; line-height:1; letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    box-shadow:0 5px 14px rgba(31,25,18,.22), inset 0 1px 0 rgba(255,255,255,.16);
  }
  .tap small{
    font-size:calc(var(--u) * .045 * var(--fit)); font-weight:700;
    letter-spacing:.2em; color:var(--ink-3); line-height:1;
  }
  .chips{display:flex; gap:.35em; flex:1; min-width:0; overflow:hidden;}
  .chip{
    flex:none; padding:.18em .58em; border-radius:999px; white-space:nowrap;
    border:1px solid var(--amber-line); background:var(--amber-bg); color:var(--amber-ink);
    font-size:calc(var(--u) * .049 * var(--fit)); font-weight:650; letter-spacing:.04em;
  }
  .status{
    display:inline-flex; align-items:center; gap:.4em;
    flex:none; padding:.34em .72em; border-radius:999px; line-height:1; white-space:nowrap;
    font-size:calc(var(--u) * .053 * var(--fit)); font-weight:700; letter-spacing:.1em;
    border:1px solid transparent; backdrop-filter:blur(4px);
  }
  .status::before{content:""; width:.42em; height:.42em; border-radius:50%; background:currentColor;}
  .status.on{color:var(--foam); border-color:var(--foam-line); background:var(--foam-bg);}
  .status.on::before{box-shadow:0 0 0 2px rgba(19,138,99,.18);}
  .status.off{color:var(--alert); border-color:var(--alert-line); background:var(--alert-bg);}

  /* 酒标保留柔和原色并做右向渐隐水印，不参与排版；无图时卡片照常满排 */
  .art{
    position:absolute; right:-2%; top:50%; transform:translateY(-50%); z-index:0;
    width:56%; height:94%; object-fit:cover; object-position:center; pointer-events:none;
    opacity:.34; filter:saturate(.88) contrast(.96) brightness(1.04);
    mix-blend-mode:multiply;
    -webkit-mask-image:radial-gradient(ellipse 88% 82% at 86% 48%, #000 22%, rgba(0,0,0,.62) 56%, transparent 94%);
    mask-image:radial-gradient(ellipse 88% 82% at 86% 48%, #000 22%, rgba(0,0,0,.62) 56%, transparent 94%);
  }
  .card::after{
    content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      linear-gradient(90deg, rgba(251,248,242,.92) 0%, rgba(251,248,242,.72) 42%, rgba(251,248,242,.18) 72%, rgba(251,248,242,.04) 100%),
      linear-gradient(to top, rgba(248,243,234,.92) 0%, rgba(248,243,234,.48) 26%, transparent 56%);
  }

  .info{position:relative; z-index:2; display:flex; flex-direction:column; flex:1; min-height:0; margin-top:calc(var(--u) * .055);}
  .brew{
    flex:none; font-size:calc(var(--u) * .061 * var(--fit)); font-weight:650;
    letter-spacing:.15em; text-transform:uppercase; color:var(--ink-2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .name{
    flex:none; margin:calc(var(--u) * .02) 0 0; color:var(--ink);
    font-size:calc(var(--u) * .158 * var(--fit)); font-weight:800; line-height:1.12;
    letter-spacing:.01em; white-space:nowrap;
  }
  .style-line{
    flex:none; margin-top:calc(var(--u) * .026);
    font-size:calc(var(--u) * .064 * var(--fit)); line-height:1.35; color:var(--ink-2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .style-line .cat{
    color:color-mix(in srgb,var(--tone) 56%,#1f1c18); font-weight:750;
  }
  .style-line .cat::before{
    content:""; display:inline-block; width:.48em; height:.48em; border-radius:50%;
    margin-right:.36em; vertical-align:.08em; background:var(--tone);
    box-shadow:0 0 0 1px rgba(31,28,24,.12);
  }

  .foot{
    display:flex; align-items:flex-end; justify-content:space-between; gap:.6em;
    margin-top:auto; padding-top:calc(var(--u) * .054); border-top:1px solid var(--line-soft);
  }
  .meta{display:flex; flex:none; align-items:flex-end; gap:calc(var(--u) * .06); min-width:0;}
  .spec{
    display:flex; flex-direction:column; gap:.22em; min-width:0;
    padding-right:calc(var(--u) * .055); border-right:1px solid var(--line-soft);
  }
  .spec:last-child{padding-right:0; border-right:0;}
  .spec b{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:calc(var(--u) * .088 * var(--fit)); font-weight:750; line-height:1.15;
    color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .spec small{
    font-size:calc(var(--u) * .045 * var(--fit)); font-weight:650; line-height:1.35;
    letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap;
  }
  .price{
    margin-left:auto; flex:none; text-align:right; white-space:nowrap;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:calc(var(--u) * .18 * var(--fit)); font-weight:800; line-height:1.15;
    letter-spacing:-.01em; color:#1b1713; font-variant-numeric:tabular-nums;
  }
  .price.price--multi{
    display:flex; align-items:stretch; gap:calc(var(--u) * .026);
    font-size:calc(var(--u) * .112 * var(--fit));
  }
  .price.price--2{
    font-size:calc(var(--u) * .13 * var(--fit));
  }
  .cup-tier{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.16em;
    padding:.22em .42em; border-radius:.34em;
    background:rgba(255,253,249,.86); border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(44,34,20,.05);
  }
  .cup-tier b{
    font-size:1em; font-weight:800; line-height:1.08; letter-spacing:-.01em;
    color:#1b1713; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .cup-tier small{
    font-size:.42em; font-weight:700; line-height:1.15; letter-spacing:.04em;
    color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap;
  }

  /* 售罄：信息保持可读，降对比 + 状态标红；编号徽章去色 + 轻微斜纹氛围 */
  .card.off{
    background:
      repeating-linear-gradient(-45deg,rgba(44,35,24,.028) 0 10px,transparent 10px 20px),
      linear-gradient(160deg,#ede7dc,#e7e0d4 58%,#e2dacd);
    border-color:rgba(46,38,26,.09);
  }
  .card.off::before{opacity:.32;}
  .card.off .info{opacity:.60;}
  .card.off .art{opacity:.10; filter:grayscale(.75) brightness(1.06);}
  .card.off .tap b{background:#aba193; color:#fffdf9; box-shadow:none;}
  .card.off .price{color:var(--ink-2); text-shadow:none;}
  .card.off .cup-tier{background:rgba(235,229,218,.72); border-color:rgba(46,38,26,.08); box-shadow:none;}
  .card.off .cup-tier b{color:var(--ink-2);}

  .hint{
    position:fixed; inset:var(--head) 0 0; z-index:2; display:none; place-items:center;
    color:var(--ink-2); font-size:clamp(18px,1.5vw,32px); letter-spacing:.3em; text-indent:.3em;
  }
  .empty .hint{display:grid;}
  .empty .board{display:none;}

  :focus-visible{outline:2px solid var(--foam); outline-offset:3px;}

  @media (max-width:720px){
    .kicker,.summary{display:none;}
  }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="whale" src="{{asset "/static/brand/pourops-light.svg"}}" alt="" onerror="this.style.visibility='hidden'">
      <div class="brand-txt">
        <div class="mark" id="brand"></div>
        <div class="kicker">TAP LIST · 精酿生啤</div>
      </div>
    </div>
    <div class="head-r">
      <div class="summary">今日酒单 <b id="count"></b></div>
      <div class="clock" id="clock"></div>
    </div>
  </header>

  <main class="board" id="board"></main>
  <div class="hint">正在同步酒单</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var SOURCES = [q.get('src'), '/api/screen/playlist', 'playlist.json'].filter(Boolean);
  var EVENTS = q.get('events') || '/api/screen/events';
  var CACHE_KEY = 'screen:menu:v3';

  var board = document.getElementById('board');
  var brandEl = document.getElementById('brand');
  var clockEl = document.getElementById('clock');
  var countEl = document.getElementById('count');
  var hintEl = document.querySelector('.hint');

  var data = null;
  var signature = '';
  var es = null;

  /* 风格 → 顶栏色条。9 种精酿默认分类独立高区分度配色 + 兼容旧分类 + 自定义分类稳定取色 */
  var PALETTE = ['#a3e635', '#2dd4bf', '#818cf8', '#e879f9', '#38bdf8', '#fbbf24', '#fb7185', '#34d399', '#c084fc', '#f97316'];
  var LEGACY_CATS = {
    fresh: '拉格',
    hop: 'IPA',
    sour: '酸艾尔',
    dark: '世涛',
    strong: '世涛',
    '清爽': '拉格',
    '酒花': 'IPA',
    '酸野菌': '酸艾尔',
    '深色': '世涛',
    '烈性': '世涛'
  };
  var CAT_COLORS = {
    'IPA': '#57cf9b',    // 翠绿
    '西打': '#f87171',   // 苹果红
    '拉格': '#facc15',   // 明金黄
    '皮尔森': '#60a5fa', // 清冽蓝
    '小麦': '#fb923c',   // 柑橘橙
    '酸小麦': '#22d3ee', // 湖水青
    '酸艾尔': '#a48bf0', // 紫罗兰
    '果泥': '#f472b6',   // 浆果粉
    '世涛': '#a87148',   // 烘焙棕
    '波特': '#94a3b8',   // 历史兼容：冷石板灰
    '修道院': '#fb7185'  // 历史兼容：玫瑰红
  };

  function categoryName(style, category) {
    var c = String(category || '').trim();
    if (c) return LEGACY_CATS[c] || LEGACY_CATS[c.toLowerCase()] || c;
    var s = String(style || '').toLowerCase();
    if (/cider|perry|pomme|苹果酒|西打/.test(s)) return '西打';
    if (/smoothie|puree|slush|fruited|pastry sour|果泥|奶昔/.test(s)) return '果泥';
    if (/berliner|gose|酸小麦|柏林|古斯/.test(s)) return '酸小麦';
    if (/lambic|gueuze|geuze|sour|wild|flanders|oude|brett|酸艾尔|兰比克|贵兹|野菌|法兰德斯|酸啤|酸/.test(s)) return '酸艾尔';
    if (/\bipa\b|neipa|dipa|tipa|india pale|pale ale|hazy|酒花|浑浊|印度淡/.test(s)) return 'IPA';
    if (/stout|porter|baltic|世涛|黑啤|波特/.test(s)) return '世涛';
    if (/pilsner|pilsener|\bpils\b|皮尔森|比尔森/.test(s)) return '皮尔森';
    if (/wheat|witbier|hefeweizen|weizen|weisse|weissbier|小麦|白啤/.test(s)) return '小麦';
    return '拉格';
  }

  function colorForCategory(cat) {
    if (CAT_COLORS[cat]) return CAT_COLORS[cat];
    var hash = 0;
    for (var i = 0; i < cat.length; i++) {
      hash = (hash * 31 + cat.charCodeAt(i)) >>> 0;
    }
    return PALETTE[hash % PALETTE.length];
  }

  /* 12 酒头首选 4×3；窄屏按画面比例收列，避免卡片被压成竖条 */
  var GRID = {
    1: [1, 1], 2: [2, 1], 3: [3, 1], 4: [2, 2], 5: [3, 2], 6: [3, 2],
    7: [4, 2], 8: [4, 2], 9: [3, 3], 10: [5, 2], 11: [4, 3], 12: [4, 3],
    13: [5, 3], 14: [5, 3], 15: [5, 3], 16: [4, 4]
  };

  function layout(n) {
    if (!n) return { cols: 1, rows: 1 };            /* 空酒单：不留 0 行，避免非法 CSS */
    var g = GRID[n] || [6, Math.ceil(n / 6)];
    var w = window.innerWidth || 1920, h = window.innerHeight || 1080;
    var cols = Math.min(g[0], Math.max(1, Math.round(Math.sqrt(n * (w / h)))));
    return { cols: cols, rows: Math.ceil(n / cols) };
  }

  function num(v) {
    if (v == null || v === '') return null;
    var n = parseFloat(String(v).replace(/[^\d.-]/g, ''));
    return isFinite(n) ? n : null;
  }

  function normalizeCups(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.map(function (c) {
      if (!c) return null;
      var ml = num(c.ml);
      var size = c.size != null ? String(c.size).trim() : (ml != null ? ml + 'ml' : '');
      var price = c.price != null ? String(c.price).trim() : '';
      if (!size && !price) return null;
      return { ml: ml, size: size, price: price };
    }).filter(Boolean);
  }

  // 结构不对（不是数组、也不是带 items 数组的对象）返回 null，调用方换下一个源；
  // 合法但 items 为空必须放行，否则删光酒之后屏幕还留着旧的一屏。
  function normalize(raw) {
    var items = Array.isArray(raw) ? raw : raw && raw.items;
    if (!Array.isArray(items)) return null;
    items = items.filter(function (s) { return s && (s.name || s.name_en || s.poster); });
    return {
      brand: (raw && raw.brand) || '',
      show_clock: !(raw && raw.show_clock === false),
      items: items.map(function (s, i) {
        var cups = normalizeCups(s.cups);
        var size = (s.size != null && String(s.size).trim()) || (cups.length === 1 ? cups[0].size : '');
        var price = (s.price != null && String(s.price).trim()) || (cups.length === 1 ? cups[0].price : '');
        return {
          no: s.no != null ? String(s.no) : ('0' + (i + 1)).slice(-2),
          brewery: s.brewery || '',
          brewery_en: s.brewery_en || '',
          name: s.name || s.name_en || '',
          style: s.style || '',
          category: categoryName(s.style, s.category),
          abv: num(s.abv),
          ibu: num(s.ibu),
          size: size,
          price: price,
          cups: cups,
          poster: s.poster || '',
          sold: s.sold !== false,
          tags: Array.isArray(s.tags) ? s.tags.filter(function (t) { return t; }) : [],
          sales_tags: Array.isArray(s.sales_tags) ? s.sales_tags.filter(function (t) { return typeof t === 'string' && t.trim(); }) : []
        };
      })
    };
  }

  function preload(items) {
    items.forEach(function (s) {
      if (!s.poster) return;
      var img = new Image();
      img.src = s.poster;
      if (img.decode) img.decode().catch(function () {});
    });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function spec(value, label) {
    var box = el('div', 'spec');
    box.appendChild(el('b', null, value));
    box.appendChild(el('small', null, label));
    return box;
  }

  function render() {
    var items = data.items;
    var grid = layout(items.length);
    board.style.setProperty('--cols', grid.cols);
    board.style.setProperty('--rows', grid.rows);
    board.style.setProperty('--fit', '1');

    var frag = document.createDocumentFragment();
    items.forEach(function (s, i) {
      var card = el('article', s.sold ? 'card' : 'card off');
      card.style.setProperty('--i', i);
      card.style.setProperty('--tone', colorForCategory(s.category));

      var top = el('div', 'card-top');
      var no = el('div', 'tap');
      no.appendChild(el('b', null, s.no));
      no.appendChild(el('small', null, 'TAP'));
      top.appendChild(no);

      var chips = el('div', 'chips');
      s.sales_tags.slice(0, 2).forEach(function (t) { chips.appendChild(el('span', 'chip', t)); });
      top.appendChild(chips);

      top.appendChild(el('span', s.sold ? 'status on' : 'status off', s.sold ? '在售' : '售罄'));
      card.appendChild(top);

      if (s.poster) {
        var art = el('img', 'art');
        art.src = s.poster;
        art.alt = '';
        art.decoding = 'async';
        art.onerror = function () { art.style.display = 'none'; };
        card.appendChild(art);
      }

      var info = el('div', 'info');
      info.appendChild(el('div', 'brew', [s.brewery, s.brewery_en].filter(Boolean).join(' · ')));
      info.appendChild(el('h2', 'name', s.name));

      var words = [s.category].concat(s.tags).slice(0, 4);
      var styleLine = el('div', 'style-line');
      words.forEach(function (t, k) {
        if (k) styleLine.appendChild(el('span', null, ' · '));
        styleLine.appendChild(el('span', k ? null : 'cat', t));
      });
      info.appendChild(styleLine);

      var foot = el('div', 'foot');
      var meta = el('div', 'meta');
      meta.appendChild(spec(s.abv != null ? s.abv + '%' : '—', 'ABV'));
      meta.appendChild(spec(s.ibu != null ? String(s.ibu) : '—', 'IBU'));
      if (s.cups.length > 1) {
        foot.appendChild(meta);
        var priceWrap = el('div', s.cups.length === 2 ? 'price price--multi price--2' : 'price price--multi');
        s.cups.forEach(function (cup) {
          var tier = el('div', 'cup-tier');
          tier.appendChild(el('b', null, cup.price || '—'));
          tier.appendChild(el('small', null, cup.size || '—'));
          priceWrap.appendChild(tier);
        });
        foot.appendChild(priceWrap);
      } else {
        meta.appendChild(spec(s.size || '—', '杯型'));
        foot.appendChild(meta);
        if (s.price) foot.appendChild(el('div', 'price', s.price));
      }
      info.appendChild(foot);
      card.appendChild(info);

      frag.appendChild(card);
    });

    board.replaceChildren(frag);
    fit();
  }

  /* 统一字号：以内容最高的一张为准缩到不溢出；长酒名再单独收一点，不截断 */
  function fit() {
    var cards = Array.prototype.slice.call(board.children);
    if (!cards.length) return;

    var scale = 1;
    for (var k = 0; k < 16; k++) {
      board.style.setProperty('--fit', scale.toFixed(3));
      var fits = cards.every(function (card) {
        var info = card.querySelector('.info');
        var foot = card.querySelector('.foot');
        return (!info || info.scrollHeight <= info.clientHeight + 1) &&
          (!foot || foot.scrollWidth <= foot.clientWidth + 1);
      });
      if (fits) break;
      scale *= .93;
    }
    cards.forEach(function (card) {
      var name = card.querySelector('.name');
      if (!name) return;
      var box = name.clientWidth;
      if (box > 0 && name.scrollWidth > box) {
        var fs = parseFloat(getComputedStyle(name).fontSize);
        name.style.fontSize = Math.max(fs * box / name.scrollWidth, fs * .38) + 'px';
      }
      var price = card.querySelector('.price');
      var meta = card.querySelector('.meta');
      if (price && meta) {
        for (var n = 0; n < 12; n++) {
          if (meta.getBoundingClientRect().right + 4 <= price.getBoundingClientRect().left) break;
          price.style.fontSize = (parseFloat(getComputedStyle(price).fontSize) * .92) + 'px';
        }
      }
    });
  }

  function tick() {
    if (!data || !data.show_clock) return;
    var d = new Date();
    clockEl.textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function apply(raw) {
    var next = normalize(raw);
    if (!next) return false;

    var sig = JSON.stringify(next.items) + '|' + next.brand;
    var changed = sig !== signature;
    signature = sig;
    data = next;

    var sold = next.items.filter(function (s) { return !s.sold; }).length;
    if (countEl) countEl.textContent = next.items.length ? next.items.length + ' 款' + (sold ? ' · ' + sold + ' 售罄' : '') : '';
    brandEl.textContent = next.brand || 'PourOps';
    clockEl.style.display = next.show_clock ? 'block' : 'none';
    tick();

    document.body.classList.toggle('empty', !next.items.length);
    hintEl.textContent = next.items.length ? '正在同步酒单' : '暂无酒款';

    preload(next.items);
    if (changed) render();
    return true;
  }

  function load() {
    var i = 0;
    (function attempt() {
      if (i >= SOURCES.length) { giveUp(); return; }
      var url = SOURCES[i++];
      fetch(url, { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (json) {
          var ok = apply(json);                        /* 先上屏，缓存坏了不影响展示 */
          if (ok) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(json)); } catch (e) {}
          }
          if (url.indexOf('/api/') !== -1) subscribe();   /* 静态文件没有 SSE */
          if (!ok) throw new Error('bad payload');         /* 结构不对：换下一个源 */
        })
        .catch(attempt);
    })();
  }

  function giveUp() {
    if (signature) return;                        /* 有内容就留着，别黑屏 */
    try {
      var cached = localStorage.getItem(CACHE_KEY);
      if (cached && apply(JSON.parse(cached))) return;
    } catch (e) {}
    document.body.classList.add('empty');
  }

  function subscribe() {
    if (es || !('EventSource' in window)) return;
    try {
      es = new EventSource(EVENTS);
      es.onmessage = function () { load(); };
      es.onerror = function () { es.close(); es = null; };
    } catch (e) { es = null; }
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
  });
  document.body.addEventListener('dblclick', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });

  /* 本地缓存先上屏，再静默同步 */
  try {
    var cached = localStorage.getItem(CACHE_KEY);
    if (cached) apply(JSON.parse(cached));
  } catch (e) {}

  load();
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (data) render(); }, 120);
  });
  setInterval(load, 60000);
  setInterval(tick, 10000);
  tick();
})();
</script>
</body>
</html>
{{end}}
